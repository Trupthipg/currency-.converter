

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #101828, #344054);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;
      color: #101828;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #344054;
    }

    input, select {
      width: 100%;
      padding: 13px;
      margin-bottom: 20px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    input:focus, select:focus {
      border-color: #635bff;
      box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.12);
    }

    .swap-row {
      display: flex;
      justify-content: center;
      margin: -5px 0 18px;
    }

    .swap-btn {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: #eeeaff;
      color: #5145cd;
      font-size: 23px;
      cursor: pointer;
      transition: 0.2s;
    }

    .swap-btn:hover {
      background: #dcd6ff;
      transform: rotate(180deg);
    }

    .convert-btn {
      width: 100%;
      padding: 15px;
      background: #635bff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .convert-btn:hover {
      background: #5145cd;
    }

    .result {
      margin-top: 24px;
      padding: 20px;
      background: #f2f4f7;
      border-radius: 12px;
      text-align: center;
    }

    .result-label {
      color: #667085;
      font-size: 14px;
      margin-bottom: 10px;
    }

    #result {
      font-size: 29px;
      font-weight: bold;
      color: #101828;
      overflow-wrap: anywhere;
    }

    #rate, #status {
      font-size: 13px;
      color: #667085;
      margin-top: 12px;
      line-height: 1.5;
    }

    @media (max-width: 400px) {
      .container {
        padding: 22px;
      }

      #result {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>💱 Currency Converter</h1>
    <p class="subtitle">Convert currencies with live exchange rates</p>

    <label for="amount">Amount</label>
    <input
      type="number"
      id="amount"
      value="1"
      min="0"
      step="any"
      placeholder="Enter amount"
    />

    <label for="fromCurrency">From</label>
    <select id="fromCurrency">
      <option value="INR" selected>🇮🇳 INR - Indian Rupee</option>
      <option value="USD">🇺🇸 USD - US Dollar</option>
      <option value="EUR">🇪🇺 EUR - Euro</option>
      <option value="GBP">🇬🇧 GBP - British Pound</option>
      <option value="JPY">🇯🇵 JPY - Japanese Yen</option>
    </select>

    <div class="swap-row">
      <button class="swap-btn" id="swapBtn"
        type="button" title="Swap currencies">⇅</button>
    </div>

    <label for="toCurrency">To</label>
    <select id="toCurrency">
      <option value="INR">🇮🇳 INR - Indian Rupee</option>
      <option value="USD" selected>🇺🇸 USD - US Dollar</option>
      <option value="EUR">🇪🇺 EUR - Euro</option>
      <option value="GBP">🇬🇧 GBP - British Pound</option>
      <option value="JPY">🇯🇵 JPY - Japanese Yen</option>
    </select>

    <button class="convert-btn" id="convertBtn" type="button">
      Convert Currency
    </button>

    <section class="result" aria-live="polite">
      <p class="result-label">Converted Amount</p>
      <div id="result">Loading...</div>
      <p id="rate"></p>
      <p id="status">Fetching exchange rates...</p>
    </section>
  </main>

  <script>
    const amountInput = document.getElementById("amount");
    const fromCurrency = document.getElementById("fromCurrency");
    const toCurrency = document.getElementById("toCurrency");
    const result = document.getElementById("result");
    const rateText = document.getElementById("rate");
    const statusText = document.getElementById("status");
    const convertBtn = document.getElementById("convertBtn");
    const swapBtn = document.getElementById("swapBtn");

    const symbols = {
      INR: "₹",
      USD: "$",
      EUR: "€",
      GBP: "£",
      JPY: "¥"
    };

    // Cache rates to reduce unnecessary API requests.
    const rateCache = new Map();

    async function getRates(base) {
      const cached = rateCache.get(base);

      if (cached && Date.now() - cached.time < 5 * 60 * 1000) {
        return cached.rates;
      }

      const response = await fetch(
        `https://open.er-api.com/v6/latest/${base}`
      );

      if (!response.ok) {
        throw new Error("Unable to fetch exchange rates.");
      }

      const data = await response.json();

      if (data.result !== "success" || !data.rates) {
        throw new Error("Exchange rate data is unavailable.");
      }

      rateCache.set(base, {
        rates: data.rates,
        time: Date.now()
      });

      return data.rates;
    }

    async function convertCurrency() {
      const amount = Number(amountInput.value);
      const from = fromCurrency.value;
      const to = toCurrency.value;

      if (amountInput.value.trim() === "" ||
          !Number.isFinite(amount) || amount < 0) {
        result.textContent = "Invalid amount";
        rateText.textContent = "";
        statusText.textContent = "Enter a valid non-negative amount.";
        return;
      }

      convertBtn.disabled = true;
      convertBtn.textContent = "Converting...";
      result.textContent = "Loading...";
      rateText.textContent = "";
      statusText.textContent = "Getting latest available rates...";

      try {
        const rates = await getRates(from);
        const exchangeRate = rates[to];

        if (typeof exchangeRate !== "number") {
          throw new Error("This currency pair is unavailable.");
        }

        const converted = amount * exchangeRate;

        result.textContent =
          symbols[to] + converted.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 4
          });

        rateText.textContent =
          `1 ${from} = ${exchangeRate.toLocaleString("en-US", {
            maximumFractionDigits: 6
          })} ${to}`;

        statusText.textContent =
          "Rates may be delayed. Check the API for its latest update.";
      } catch (error) {
        result.textContent = "Conversion failed";
        rateText.textContent = "";
        statusText.textContent =
          "Could not load rates. Check your internet connection and try again.";
      } finally {
        convertBtn.disabled = false;
        convertBtn.textContent = "Convert Currency";
      }
    }

    swapBtn.addEventListener("click", () => {
      const previousFrom = fromCurrency.value;
      fromCurrency.value = toCurrency.value;
      toCurrency.value = previousFrom;
      convertCurrency();
    });

    convertBtn.addEventListener("click", convertCurrency);

    amountInput.addEventListener("input", convertCurrency);
    fromCurrency.addEventListener("change", convertCurrency);
    toCurrency.addEventListener("change", convertCurrency);

    convertCurrency();
  </script>
</body>
</html>
